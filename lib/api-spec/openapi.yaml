components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`).
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    SellerProduct:
      type: object
      required:
        [
          id,
          sellerVendorId,
          name,
          category,
          pricePerUnit,
          unit,
          stockQuantity,
          photos,
          isActive,
          createdAt,
        ]
      properties:
        id:
          type: integer
        sellerVendorId:
          type: integer
        name:
          type: string
        category:
          type: string
        pricePerUnit:
          type: integer
        unit:
          type: string
        stockQuantity:
          type: integer
        description:
          type: ["string", "null"]
        photos:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
    SellerProductInput:
      type: object
      required: [name, category, pricePerUnit, unit, stockQuantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        category:
          type: string
          minLength: 1
        pricePerUnit:
          type: integer
          minimum: 0
        unit:
          type: string
          minLength: 1
        stockQuantity:
          type: integer
          minimum: 0
        description:
          type: ["string", "null"]
          maxLength: 2000
        photos:
          type: array
          items:
            type: string
        isActive:
          type: boolean
    OrderItemView:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal]
      properties:
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
        lineTotal:
          type: integer
        photo:
          type: ["string", "null"]
    BuyerOrder:
      type: object
      required: [id, status, totalAmount, createdAt, items]
      properties:
        id:
          type: integer
        status:
          type: string
        totalAmount:
          type: integer
        createdAt:
          type: string
        sellerName:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemView"
    SellerOrder:
      type: object
      required: [id, status, totalAmount, createdAt, items]
      properties:
        id:
          type: integer
        status:
          type: string
        totalAmount:
          type: integer
        createdAt:
          type: string
        buyerName:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemView"
    CartLine:
      type: object
      required:
        [
          productId,
          name,
          category,
          pricePerUnit,
          unit,
          quantity,
          stockQuantity,
          lineTotal,
        ]
      properties:
        productId:
          type: integer
        name:
          type: string
        category:
          type: string
        pricePerUnit:
          type: integer
        unit:
          type: string
        quantity:
          type: integer
        stockQuantity:
          type: integer
        photo:
          type: ["string", "null"]
        sellerName:
          type: ["string", "null"]
        lineTotal:
          type: integer
    CartView:
      type: object
      required: [items, total, itemCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartLine"
        total:
          type: integer
        itemCount:
          type: integer
    CartInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: integer
              quantity:
                type: integer
    CheckoutOrderResult:
      type: object
      required: [id, totalAmount, status]
      properties:
        id:
          type: integer
        sellerName:
          type: ["string", "null"]
        totalAmount:
          type: integer
        status:
          type: string
    CheckoutResponse:
      type: object
      required: [orders, total]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/CheckoutOrderResult"
        total:
          type: integer
    UpdateOrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, fulfilled, cancelled]
    AdminStats:
      type: object
      required:
        [totalUsers, totalVendors, totalProducts, totalOrders, totalGmv]
      properties:
        totalUsers:
          type: integer
        totalVendors:
          type: integer
        totalProducts:
          type: integer
        totalOrders:
          type: integer
        totalGmv:
          type: integer
    AdminVendor:
      type: object
      required:
        [id, businessName, category, city, isVerified, isActive, productCount, createdAt]
      properties:
        id:
          type: integer
        businessName:
          type: string
        category:
          type: string
        city:
          type: string
        ownerName:
          type: ["string", "null"]
        ownerEmail:
          type: ["string", "null"]
        isVerified:
          type: boolean
        isActive:
          type: boolean
        productCount:
          type: integer
        createdAt:
          type: string
    AdminVendorUpdate:
      type: object
      properties:
        isVerified:
          type: boolean
        isActive:
          type: boolean
    AdminCreateVendorInput:
      type: object
      required: [businessName, category, city]
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 120
        category:
          $ref: "#/components/schemas/VendorCategory"
        city:
          type: string
          minLength: 1
          maxLength: 80
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        photos:
          type: array
          items:
            type: string
        ownerEmail:
          type: ["string", "null"]
          description: Optional email of an existing user to own this vendor.
    AdminProduct:
      type: object
      required:
        [id, name, category, pricePerUnit, unit, stockQuantity, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        pricePerUnit:
          type: integer
        unit:
          type: string
        stockQuantity:
          type: integer
        sellerName:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
    AdminProductUpdate:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
    AdminOrder:
      type: object
      required: [id, status, totalAmount, createdAt, itemCount]
      properties:
        id:
          type: integer
        status:
          type: string
        totalAmount:
          type: integer
        createdAt:
          type: string
        buyerName:
          type: ["string", "null"]
        sellerName:
          type: ["string", "null"]
        itemCount:
          type: integer
    AdminUser:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        createdAt:
          type: string
    AdminUserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [couple, vendor, organizer, admin]
    DasturxonItem:
      type: object
      required: [itemName, quantity]
      properties:
        itemName:
          type: string
        quantity:
          type: integer
        approxCost:
          type: ["integer", "null"]
    DasturxonItemInput:
      type: object
      required: [itemName, quantity]
      properties:
        itemName:
          type: string
          minLength: 1
          maxLength: 80
        quantity:
          type: integer
          minimum: 0
          maximum: 100000
        approxCost:
          type: ["integer", "null"]
          minimum: 0
    DasturxonEntry:
      type: object
      required:
        [id, city, guestCount, totalSpentOnFood, perGuestSpend, items, photos, createdAt]
      properties:
        id:
          type: integer
        city:
          type: string
        guestCount:
          type: integer
        totalSpentOnFood:
          type: integer
        perGuestSpend:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/DasturxonItem"
        photos:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    MyDasturxonEntry:
      type: object
      required:
        [
