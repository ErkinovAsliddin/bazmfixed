openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: budget
    description: Wedding budget planner operations
  - name: vendors
    description: Vendor marketplace and comparison operations
  - name: vendor-dashboard
    description: Vendor-side profile, tier, and inquiry management
  - name: dasturxon
    description: Dasturxon (wedding table) comparison — real weddings, real spend
  - name: sufficiency
    description: Food/product quantity sufficiency calculator — "will it be enough?"
  - name: marketplace
    description: Marketplace product catalog for physical wedding goods
  - name: organizer
    description: Organizer dashboard — client roster and plan oversight
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Sign out of the current session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/phone/request-otp:
    post:
      operationId: requestPhoneOtp
      tags: [auth]
      summary: Request a one-time login code by phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpRequestInput"
      responses:
        "200":
          description: Code sent (SMS is stubbed in development)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneOtpRequestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/phone/verify-otp:
    post:
      operationId: verifyPhoneOtp
      tags: [auth]
      summary: Verify a phone code and sign in, creating an account if needed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneOtpVerifyInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /budget/estimate:
    post:
      operationId: estimateBudget
      tags: [budget]
      summary: Compute a wedding budget breakdown, sufficiency check, and scenarios
      description: >
        Pure computation from seeded vendor tier data. Public — a visitor can try
        the planner before creating an account. Does not persist anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetEstimateInput"
      responses:
        "200":
          description: Computed budget estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetEstimate"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /budget/plans:
    get:
      operationId: listBudgetPlans
      tags: [budget]
      summary: List the signed-in user's saved budget plans
      responses:
        "200":
          description: Saved plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetPlanSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBudgetPlan
      tags: [budget]
      summary: Save a budget plan for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBudgetPlanInput"
      responses:
        "201":
          description: Plan saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetPlan"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /budget/plans/{id}:
    get:
      operationId: getBudgetPlan
      tags: [budget]
      summary: Get one of the signed-in user's saved plans with full breakdown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedBudgetPlan"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /budget/shared/{token}:
    get:
      operationId: getSharedBudgetPlan
      tags: [budget]
      summary: Public read-only "share with family" view of a plan
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedBudgetPlan"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /budget/options:
    get:
      operationId: getBudgetOptions
      tags: [budget]
      summary: Verified vendor tiers per planner category for the manual picker
      parameters:
        - name: city
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CityOption"
        - name: guestCount
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5000
      responses:
        "200":
          description: Category options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetCategoryOptions"
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors, optionally filtered by category and city
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/VendorCategory"
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorSummary"
  /vendors/category/{category}:
    get:
      operationId: getCategoryComparison
      tags: [vendors]
      summary: Compare every vendor's tiers for one category side by side
      parameters:
        - name: category
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/VendorCategory"
        - name: guestCount
          in: query
          required: false
          description: When provided, each tier includes an estimatedCost for this guest count.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Category comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryComparison"
  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get one vendor with all its tiers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorDetail"
        "404":
          description: Vendor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vendors/{id}/inquiries:
    post:
      operationId: createVendorInquiry
      tags: [vendors]
      summary: Log an inquiry and reveal the vendor's contact phone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInquiryInput"
      responses:
        "201":
          description: Inquiry logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorContactResponse"
        "404":
          description: Vendor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vendor/me:
    get:
      operationId: getMyVendor
      tags: [vendor-dashboard]
      summary: Get the signed-in vendor's profile, tiers, and inquiry count
      responses:
        "200":
          description: Vendor profile (vendor is null if not yet created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyVendorProfile"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a vendor account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertMyVendor
      tags: [vendor-dashboard]
      summary: Create or update the signed-in vendor's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertVendorInput"
      responses:
        "200":
          description: Updated vendor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorWithTiers"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a vendor account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vendor/me/tiers:
    post:
      operationId: createMyVendorTier
      tags: [vendor-dashboard]
      summary: Add a tier to the signed-in vendor's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorTierInput"
      responses:
        "201":
          description: Created tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorTier"
        "400":
          description: Invalid input or no vendor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a vendor account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vendor/me/tiers/{tierId}:
    put:
      operationId: updateMyVendorTier
      tags: [vendor-dashboard]
      summary: Update one of the signed-in vendor's tiers
      parameters:
        - name: tierId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorTierInput"
      responses:
        "200":
          description: Updated tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorTier"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a vendor account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tier not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyVendorTier
      tags: [vendor-dashboard]
      summary: Delete one of the signed-in vendor's tiers
      parameters:
        - name: tierId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a vendor account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tier not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dasturxon:
    get:
      operationId: listDasturxon
      tags: [dasturxon]
      summary: Public feed of real weddings' dasturxon spreads
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: minGuests
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
        - name: maxGuests
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
      responses:
        "200":
          description: Matching public dasturxon entries (anonymized)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DasturxonEntry"
    post:
      operationId: createDasturxon
      tags: [dasturxon]
      summary: Submit your own dasturxon after the wedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDasturxonInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyDasturxonEntry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dasturxon/mine:
    get:
      operationId: listMyDasturxon
      tags: [dasturxon]
      summary: The signed-in user's own dasturxon entries (public and private)
      responses:
        "200":
          description: Your entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyDasturxonEntry"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dasturxon/stats:
    get:
      operationId: getDasturxonStats
      tags: [dasturxon]
      summary: Local benchmark — average food spend per guest, optionally by city
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Aggregate stats across public entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DasturxonStats"
  /dasturxon/comparison:
    get:
      operationId: getDasturxonComparison
      tags: [dasturxon]
      summary: Your planned dasturxon vs. similar-sized real weddings
      responses:
        "200":
          description: Comparison against weddings within +/-20% of your guest count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DasturxonComparison"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sufficiency:
    post:
      operationId: calculateSufficiency
      tags: [sufficiency]
      summary: Recommended food/product quantities for a guest count and duration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateSufficiencyInput"
      responses:
        "200":
          description: Per-category recommended quantity ranges with a safety buffer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SufficiencyResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /marketplace/products:
    get:
      operationId: listMarketplaceProducts
      tags: [marketplace]
      summary: Active marketplace products, optionally filtered by category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Active products for sale
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceProduct"
  /organizer/clients:
    get:
      operationId: listOrganizerClients
      tags: [organizer]
      summary: List the signed-in organizer's clients with budget snapshots
      responses:
        "200":
          description: Clients with a quick-glance budget snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizerClientSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an organizer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrganizerClient
      tags: [organizer]
      summary: Add a client, optionally linking a couple already on Bazm by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizerClientInput"
      responses:
        "201":
          description: The created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerClientSummary"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an organizer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /organizer/clients/{id}:
    get:
      operationId: getOrganizerClient
      tags: [organizer]
      summary: One client with their linked plan, chosen tiers, and pending decisions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerClientDetail"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an organizer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /organizer/summary:
    get:
      operationId: getOrganizerSummary
      tags: [organizer]
      summary: Weekly outreach summary — upcoming weddings and unresolved clients
      responses:
        "200":
          description: Summary counts and upcoming weddings in the next 30 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an organizer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # ---------------------------------------------------------------------------
  # Seller products (role=vendor, scoped to the owned vendor)
  # ---------------------------------------------------------------------------
  /vendor/me/products:
    get:
      operationId: listMyProducts
      tags: [seller-products]
      summary: List the signed-in vendor's products (including inactive)
      responses:
        "200":
          description: The vendor's products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerProduct"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
